name: Coleta diaria IMEA

on:
  schedule:
    # 11:00 UTC = 08:00 no horario de Brasilia
    - cron: "0 11 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar o bot
        run: python main.py

      - name: Publicar os dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Nenhuma novidade hoje: nada a publicar."
          else
            git commit -m "Dados IMEA de $(date -u +'%d/%m/%Y')"
            git push
          fi

      - name: Guardar a planilha como artefato
        uses: actions/upload-artifact@v4
        with:
          name: planilhas-imea
          path: dados/*.xlsx
          retention-days: 30
